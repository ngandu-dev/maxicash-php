name: Release

on:
  push:
    tags:
      - "**"
      - "!**[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Verify stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ [0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "Prerelease tags are handled manually."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - name: Run quality checks and tests
        run: composer quality
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
